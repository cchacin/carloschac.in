<div class="search-container">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search posts..." aria-label="Search posts">
    <button id="search-button" aria-label="Search">🔍</button>
  </div>
  <div id="search-results" class="search-results" role="region" aria-label="Search results"></div>
</div>

<script>
// Simple client-side search functionality
(function() {
  const searchInput = document.getElementById('search-input');
  const searchButton = document.getElementById('search-button');
  const searchResults = document.getElementById('search-results');

  // Post data for search (generated by Jekyll)
  const posts = [
    {% for post in site.posts %}
    {
      title: {{ post.title | jsonify }},
      url: "{{ site.baseurl }}{{ post.url }}",
      excerpt: {{ post.excerpt | strip_html | jsonify }},
      tags: {{ post.tags | jsonify }},
      date: "{{ post.date | date: '%B %d, %Y' }}"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function performSearch(query) {
    if (!query || query.length < 2) {
      searchResults.innerHTML = '';
      searchResults.style.display = 'none';
      return;
    }

    const lowerQuery = query.toLowerCase();
    const matches = posts.filter(post =>
      post.title.toLowerCase().includes(lowerQuery) ||
      post.excerpt.toLowerCase().includes(lowerQuery) ||
      post.tags.some(tag => tag.toLowerCase().includes(lowerQuery))
    );

    if (matches.length === 0) {
      searchResults.innerHTML = '<div class="no-results">No posts found matching your search.</div>';
    } else {
      searchResults.innerHTML = matches.map(post => `
        <article class="search-result">
          <h3><a href="${post.url}">${post.title}</a></h3>
          <p class="search-excerpt">${post.excerpt}</p>
          <div class="search-meta">
            <span class="search-date">${post.date}</span>
            ${post.tags.length > 0 ? `<span class="search-tags">${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</span>` : ''}
          </div>
        </article>
      `).join('');
    }

    searchResults.style.display = 'block';
  }

  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  const debouncedSearch = debounce(performSearch, 300);

  searchInput.addEventListener('input', (e) => {
    debouncedSearch(e.target.value);
  });

  searchButton.addEventListener('click', () => {
    performSearch(searchInput.value);
  });

  searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      performSearch(searchInput.value);
    }
  });

  // Hide results when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-container')) {
      searchResults.style.display = 'none';
    }
  });
})();
</script>
